global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: "mission03-application"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "mission03-web:8080"

  - job_name: "mission03-node-exporter"
    static_configs:
      - targets:
          - "mission03-node-exporter:9100"
