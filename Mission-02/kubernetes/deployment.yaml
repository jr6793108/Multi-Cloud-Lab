apiVersion: apps/v1
kind: Deployment
metadata:
  name: mission02-web
  labels:
    app: mission02-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mission02-web
  template:
    metadata:
      labels:
        app: mission02-web
    spec:
      containers:
        - name: web
          image: mission02-web:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "1.0"
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
